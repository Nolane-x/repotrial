name: RepoTrial
branding:
  icon: shield
  color: red
description: Evidence-backed static, runtime, supply-chain, reasoning, adaptive experiment, causal attack synthesis, and ForgeOS security analysis for AI-agent repositories.
inputs:
  path:
    description: Repository directory to scan.
    required: false
    default: .
  output:
    description: Artifact directory.
    required: false
    default: .repotrial
  exclude-paths:
    description: Optional comma-separated repository-relative paths to exclude from all providers.
    required: false
    default: ''
  fail-on:
    description: cautious, reckless, or dangerous.
    required: false
    default: reckless
  fail-on-new:
    description: Optional cautious, reckless, or dangerous threshold applied only to new findings.
    required: false
    default: ''
  fail-on-reasoning:
    description: Optional info, low, medium, high, or critical threshold for active reasoning hypotheses or invariant violations.
    required: false
    default: ''
  fail-on-new-reasoning:
    description: Optional severity threshold applied only to newly introduced viable attack paths, hypothesis regressions, or invariant violations.
    required: false
    default: ''
  fail-on-causal:
    description: Optional info, low, medium, high, or critical threshold for active causal attack chains.
    required: false
    default: ''
  fail-on-new-causal:
    description: Optional severity threshold for newly active or regressed causal attack chains since the baseline.
    required: false
    default: ''
  baseline-ref:
    description: Optional Git ref used for differential analysis.
    required: false
    default: ''
  runtime-mode:
    description: off, auto, or sandbox. Sandbox is Linux-only and opt-in.
    required: false
    default: 'off'
  runtime-scripts:
    description: Optional comma-separated package scripts to detonate.
    required: false
    default: ''
  runtime-max-source-files:
    description: Maximum repository files copied into each runtime sandbox.
    required: false
    default: '20000'
  runtime-max-source-bytes:
    description: Maximum repository bytes copied into each runtime sandbox.
    required: false
    default: '268435456'
  experiment-mode:
    description: off, plan, or sandbox. Plan is non-executing; sandbox uses synthetic canaries and the existing containment boundary.
    required: false
    default: 'off'
  experiment-max-runs:
    description: Maximum targeted adaptive experiments.
    required: false
    default: '6'
  experiment-max-per-candidate:
    description: Maximum experiments planned for one runtime candidate.
    required: false
    default: '2'
  experiment-timeout:
    description: Optional experiment wall-clock timeout in milliseconds; empty reuses the runtime default.
    required: false
    default: ''
  causal-mode:
    description: off, analyze, discover, or active. Analyze/discover are non-executing; active runs bounded synthetic adversarial episodes in the existing sandbox.
    required: false
    default: 'off'
  causal-max-depth:
    description: Maximum causal chain depth retained by bounded synthesis.
    required: false
    default: '8'
  causal-max-chains:
    description: Maximum causal attack chains retained per scan.
    required: false
    default: '64'
  causal-max-runs:
    description: Maximum active causal verification episodes.
    required: false
    default: '6'
  causal-max-per-candidate:
    description: Maximum active causal probes for one runtime candidate.
    required: false
    default: '2'
  causal-realm-scope:
    description: all or production. Production scope gates only production-relevant causal chains while keeping other realms visible.
    required: false
    default: 'all'
  causal-max-discovered:
    description: Maximum autonomous threat-hypothesis candidates retained by discovery.
    required: false
    default: '32'
  causal-min-novelty:
    description: Minimum novelty score from 0 to 1 versus registered threat definitions.
    required: false
    default: '0.35'
  causal-timeout:
    description: Optional per-phase causal episode timeout in milliseconds; empty reuses the runtime default.
    required: false
    default: ''
  supply-chain-mode:
    description: off, offline, or osv.
    required: false
    default: offline
  signing-key:
    description: Optional path to an Ed25519 private key in the workspace.
    required: false
    default: ''
  sigstore:
    description: Create a Sigstore bundle with cosign. Uses GitHub OIDC keyless signing unless sigstore-key is set.
    required: false
    default: 'false'
  sigstore-key:
    description: Optional cosign key URI or file.
    required: false
    default: ''
  forgeos-mode:
    description: off, auto, cli, or http.
    required: false
    default: 'off'
  forgeos-root:
    description: Optional ForgeOS source checkout containing src/cli/forge.mjs.
    required: false
    default: ''
  forgeos-depth:
    description: security or full. Full adds kernel evidence and a remediation RoutePlan.
    required: false
    default: security
  upload-sarif:
    description: Upload SARIF to GitHub code scanning. Caller must grant security-events write permission.
    required: false
    default: 'false'
outputs:
  verdict:
    description: RepoTrial verdict label.
    value: ${{ steps.scan.outputs.verdict }}
  score:
    description: Deterministic risk score.
    value: ${{ steps.scan.outputs.score }}
  new-findings:
    description: Number of findings introduced since the baseline.
    value: ${{ steps.scan.outputs.new_findings }}
  viable-attack-paths:
    description: Number of currently viable evidence-reasoning attack paths.
    value: ${{ steps.scan.outputs.viable_attack_paths }}
  invariant-violations:
    description: Number of currently violated security invariants.
    value: ${{ steps.scan.outputs.invariant_violations }}
  new-viable-attack-paths:
    description: Number of newly introduced viable attack paths since the baseline.
    value: ${{ steps.scan.outputs.new_viable_attack_paths }}
  new-invariant-violations:
    description: Number of newly introduced invariant violations since the baseline.
    value: ${{ steps.scan.outputs.new_invariant_violations }}
  causal-active-chains:
    description: Number of currently active PROVEN or SUPPORTED causal attack chains.
    value: ${{ steps.scan.outputs.causal_active_chains }}
  causal-high-impact-active-chains:
    description: Number of active high or critical causal attack chains.
    value: ${{ steps.scan.outputs.causal_high_impact_active_chains }}
  causal-production-active-chains:
    description: Number of active causal chains assessed as production relevant.
    value: ${{ steps.scan.outputs.causal_production_active_chains }}
  causal-non-production-active-chains:
    description: Number of active causal chains supported only by non-production evidence realms.
    value: ${{ steps.scan.outputs.causal_non_production_active_chains }}
  discovered-hypotheses:
    description: Number of autonomous threat-hypothesis candidates retained.
    value: ${{ steps.scan.outputs.discovered_hypotheses }}
  promotable-hypotheses:
    description: Number of autonomous candidates eligible for transient verification promotion.
    value: ${{ steps.scan.outputs.promotable_hypotheses }}
  new-causal-active-chains:
    description: Number of newly active causal chains since the baseline.
    value: ${{ steps.scan.outputs.new_causal_active_chains }}
  causal-path:
    description: Causal analysis JSON artifact path when causal analysis is enabled.
    value: ${{ steps.scan.outputs.causal_path }}
  hypotheses-path:
    description: Autonomous hypothesis discovery JSON artifact path when discovery is enabled.
    value: ${{ steps.scan.outputs.hypotheses_path }}
  experiments-status:
    description: Adaptive experiment status or disabled.
    value: ${{ steps.scan.outputs.experiments_status }}
  experiments-planned:
    description: Number of adaptive experiments planned.
    value: ${{ steps.scan.outputs.experiments_planned }}
  experiments-executed:
    description: Number of adaptive experiments executed.
    value: ${{ steps.scan.outputs.experiments_executed }}
  experiments-positive:
    description: Number of experiments with direct positive observations.
    value: ${{ steps.scan.outputs.experiments_positive }}
  epistemic-transitions:
    description: Number of hypothesis and attack-path transitions caused by assimilated experiment evidence.
    value: ${{ steps.scan.outputs.epistemic_transitions }}
  experiments-path:
    description: Adaptive experiments JSON artifact path when enabled.
    value: ${{ steps.scan.outputs.experiments_path }}
  report-path:
    description: Portable HTML report path.
    value: ${{ steps.scan.outputs.report_path }}
  sarif-path:
    description: SARIF 2.1.0 report path.
    value: ${{ steps.scan.outputs.sarif_path }}
  sbom-path:
    description: CycloneDX 1.6 SBOM path.
    value: ${{ steps.scan.outputs.sbom_path }}
  proof-path:
    description: Artifact proof path.
    value: ${{ steps.scan.outputs.proof_path }}
  attestation-path:
    description: Signed DSSE provenance path when signing is enabled.
    value: ${{ steps.scan.outputs.attestation_path }}
  sigstore-path:
    description: Sigstore bundle path when cosign signing is enabled.
    value: ${{ steps.scan.outputs.sigstore_path }}
  receipt:
    description: SHA-256 report receipt.
    value: ${{ steps.scan.outputs.receipt }}
  forgeos-version:
    description: Connected ForgeOS version when available.
    value: ${{ steps.scan.outputs.forgeos_version }}
  forgeos-technique:
    description: Primary ForgeOS remediation technique when full mode is enabled.
    value: ${{ steps.scan.outputs.forgeos_technique }}
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install cosign
      if: inputs.sigstore == 'true'
      uses: sigstore/cosign-installer@v3
    - name: Run RepoTrial
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
        INPUT_FAIL_ON_REASONING: ${{ inputs.fail-on-reasoning }}
        INPUT_FAIL_ON_NEW_REASONING: ${{ inputs.fail-on-new-reasoning }}
        INPUT_FAIL_ON_CAUSAL: ${{ inputs.fail-on-causal }}
        INPUT_FAIL_ON_NEW_CAUSAL: ${{ inputs.fail-on-new-causal }}
        INPUT_BASELINE_REF: ${{ inputs.baseline-ref }}
        INPUT_RUNTIME_MODE: ${{ inputs.runtime-mode }}
        INPUT_RUNTIME_SCRIPTS: ${{ inputs.runtime-scripts }}
        INPUT_RUNTIME_MAX_SOURCE_FILES: ${{ inputs.runtime-max-source-files }}
        INPUT_RUNTIME_MAX_SOURCE_BYTES: ${{ inputs.runtime-max-source-bytes }}
        INPUT_EXPERIMENT_MODE: ${{ inputs.experiment-mode }}
        INPUT_EXPERIMENT_MAX_RUNS: ${{ inputs.experiment-max-runs }}
        INPUT_EXPERIMENT_MAX_PER_CANDIDATE: ${{ inputs.experiment-max-per-candidate }}
        INPUT_EXPERIMENT_TIMEOUT: ${{ inputs.experiment-timeout }}
        INPUT_CAUSAL_MODE: ${{ inputs.causal-mode }}
        INPUT_CAUSAL_MAX_DEPTH: ${{ inputs.causal-max-depth }}
        INPUT_CAUSAL_MAX_CHAINS: ${{ inputs.causal-max-chains }}
        INPUT_CAUSAL_MAX_RUNS: ${{ inputs.causal-max-runs }}
        INPUT_CAUSAL_MAX_PER_CANDIDATE: ${{ inputs.causal-max-per-candidate }}
        INPUT_CAUSAL_REALM_SCOPE: ${{ inputs.causal-realm-scope }}
        INPUT_CAUSAL_MAX_DISCOVERED: ${{ inputs.causal-max-discovered }}
        INPUT_CAUSAL_MIN_NOVELTY: ${{ inputs.causal-min-novelty }}
        INPUT_CAUSAL_TIMEOUT: ${{ inputs.causal-timeout }}
        INPUT_SUPPLY_CHAIN_MODE: ${{ inputs.supply-chain-mode }}
        INPUT_SIGNING_KEY: ${{ inputs.signing-key }}
        INPUT_SIGSTORE: ${{ inputs.sigstore }}
        INPUT_SIGSTORE_KEY: ${{ inputs.sigstore-key }}
        INPUT_FORGEOS_MODE: ${{ inputs.forgeos-mode }}
        INPUT_FORGEOS_ROOT: ${{ inputs.forgeos-root }}
        INPUT_FORGEOS_DEPTH: ${{ inputs.forgeos-depth }}
      run: node "$GITHUB_ACTION_PATH/scripts/github-action.mjs"
    - name: Upload RepoTrial SARIF
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif_path }}
        category: repotrial
    - name: Upload RepoTrial report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: repotrial-report
        path: ${{ inputs.output }}
        if-no-files-found: error
