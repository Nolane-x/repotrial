name: CI
on:
  push:
    branches:
      - feat/causal-adversarial-reasoning-v0.7
permissions:
  contents: read
jobs:
  apply-v07-payload:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/causal-adversarial-reasoning-v0.7
          fetch-depth: 0
      - name: Apply locally verified RepoTrial 0.7 source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test -f .repotrial-v07-payload.tgz
          tar --exclude='.github/workflows/ci.yml' -xzf .repotrial-v07-payload.tgz
          rm -f .repotrial-v07-payload.tgz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: RepoTrial 0.7 causal adversarial reasoning engine'
          git push origin HEAD:feat/causal-adversarial-reasoning-v0.7
