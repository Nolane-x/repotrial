name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  apply-review-fix-v08:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply realm-scoped corroboration review fix
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .repotrial-review-fix-v08.patch.gz.b64 ]; then
            echo 'No review fix patch staged; no-op.'
            exit 0
          fi
          tr -d '\r\n' < .repotrial-review-fix-v08.patch.gz.b64 > /tmp/v08-review-fix.patch.gz.b64
          echo '9887771e7f3ad48521cfd4615363200f53657769fa0552c0993f5f4d7a40b1ce  /tmp/v08-review-fix.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/v08-review-fix.patch.gz.b64 > /tmp/v08-review-fix.patch.gz
          gzip -dc /tmp/v08-review-fix.patch.gz > /tmp/v08-review-fix.patch
          echo '9cdb043bc516f4093368937981cd32306e54a543e4060d0aff0f37ff95a55b2d  /tmp/v08-review-fix.patch' | sha256sum -c -
          git apply --check /tmp/v08-review-fix.patch
          git apply /tmp/v08-review-fix.patch
          rm -f .repotrial-review-fix-v08.patch.gz.b64 .repotrial-review-fix-v08.trigger
          git config user.name 'Nolane-x'
          git config user.email 'casioreview20@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: scope hypothesis corroboration to candidate evidence realm'
          git push
  test:
    strategy:
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run benchmark:adversarial
      - run: npm run benchmark:discovery
      - run: node bin/repotrial.mjs scan tests/fixtures/cautious-agent --forgeos off --runtime off --supply-chain offline --output .repotrial-ci --fail-on reckless
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repotrial-node-${{ matrix.node }}
          path: .repotrial-ci
          if-no-files-found: warn
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm pack --dry-run
      - run: docker build -t repotrial:test .
      - run: docker run --rm repotrial:test version
