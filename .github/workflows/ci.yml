name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sync-v08:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checksum-locked RepoTrial 0.8 source patch when staged
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .repotrial-sync-v08/chunk-00 ]; then
            echo 'No RepoTrial 0.8 sync payload is staged; no-op.'
            exit 0
          fi
          cat .repotrial-sync-v08/chunk-00 .repotrial-sync-v08/chunk-01 .repotrial-sync-v08/chunk-02 .repotrial-sync-v08/chunk-03 > /tmp/repotrial-v08.patch.gz.b64
          echo '7b49591b2d868758e100eb586e7dc00abcd35d6b2df5c95129ffd6f3813f674a  /tmp/repotrial-v08.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/repotrial-v08.patch.gz.b64 > /tmp/repotrial-v08.patch.gz
          gzip -dc /tmp/repotrial-v08.patch.gz > /tmp/repotrial-v08.patch
          echo 'a9c94fe9569b88fb9ce11958ac96dcf5768492593e6530b7a04322564434b579  /tmp/repotrial-v08.patch' | sha256sum -c -
          git apply --check /tmp/repotrial-v08.patch
          git apply /tmp/repotrial-v08.patch
          rm -rf .repotrial-sync-v08
          git config user.name 'Nolane-x'
          git config user.email 'casioreview20@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: autonomous threat discovery and evidence realms v0.8'
          git push
  test:
    strategy:
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run benchmark:adversarial
      - run: node bin/repotrial.mjs scan tests/fixtures/cautious-agent --forgeos off --runtime off --supply-chain offline --output .repotrial-ci --fail-on reckless
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repotrial-node-${{ matrix.node }}
          path: .repotrial-ci
          if-no-files-found: warn
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm pack --dry-run
      - run: docker build -t repotrial:test .
      - run: docker run --rm repotrial:test version
