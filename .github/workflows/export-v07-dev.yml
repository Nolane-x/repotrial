name: Export RepoTrial 0.7 development tree
on:
  push:
    branches:
      - feat/causal-adversarial-reasoning-v0.7
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record checkout identity
        run: git rev-parse HEAD > REPOTRIAL_DEV_SOURCE_COMMIT.txt
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: repotrial-v07-dev-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            .dockerignore
            .github
            .gitignore
            CHANGELOG.md
            CODE_OF_CONDUCT.md
            CONTRIBUTING.md
            Dockerfile
            LICENSE
            README-VN.md
            README.md
            README.vi.md
            SECURITY.md
            action.yml
            bin
            docs
            integrations
            package-lock.json
            package.json
            project-manifest.json
            schemas
            scripts
            src
            tests
            REPOTRIAL_DEV_SOURCE_COMMIT.txt
