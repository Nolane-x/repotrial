name: Sync verified RepoTrial 0.7 source

on:
  push:
    branches:
      - feat/causal-adversarial-reasoning-v0.7

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .repotrial-sync/chunk-00 ]]; then
            echo 'RepoTrial 0.7 source already synchronized.'
            exit 0
          fi
          cat .repotrial-sync/chunk-* > /tmp/v07.patch.gz.b64
          printf '%s  %s\n' '351d2827105cee5f53832be9aa2815c5e5d4f2fb0ad23f48517e6488d8e1335e' '/tmp/v07.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/v07.patch.gz.b64 | gzip -d > /tmp/v07.patch
          printf '%s  %s\n' 'd427b3c7d584da5ea2397db5967ef60604cdfe5befce4c381574c76be729945f' '/tmp/v07.patch' | sha256sum -c -
          git apply --check /tmp/v07.patch
          git apply /tmp/v07.patch
          rm -rf .repotrial-sync
          git config user.name 'RepoTrial CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate causal adversarial reasoning v0.7'
          git push origin HEAD:feat/causal-adversarial-reasoning-v0.7
