name: Export source artifact

on:
  push:
    branches:
      - chore/export-v0.6.0-artifact

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be6eb319b4ef425f2028aad7ca4a0a3f0a12ade8
      - name: Record source identity
        run: |
          printf '%s\n' 'be6eb319b4ef425f2028aad7ca4a0a3f0a12ade8' > REPOTRIAL_SOURCE_COMMIT.txt
          git rev-parse HEAD > REPOTRIAL_CHECKED_OUT_COMMIT.txt
      - name: Upload complete project tree
        uses: actions/upload-artifact@v4
        with:
          name: repotrial-v0.6.0-main-be6eb319-complete
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .dockerignore
            .github
            .gitignore
            CHANGELOG.md
            CODE_OF_CONDUCT.md
            CONTRIBUTING.md
            Dockerfile
            LICENSE
            README-VN.md
            README.md
            README.vi.md
            SECURITY.md
            action.yml
            bin
            docs
            integrations
            package-lock.json
            package.json
            project-manifest.json
            schemas
            scripts
            src
            tests
            REPOTRIAL_SOURCE_COMMIT.txt
            REPOTRIAL_CHECKED_OUT_COMMIT.txt
