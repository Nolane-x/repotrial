name: NUI Flagship Website CI

on:
  push:
    branches:
      - build/nui-flagship-ci

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: nui-flagship-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit contract tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser evidence
        run: npm run test:e2e

      - name: Package milestone
        if: always()
        run: zip -q -r /tmp/NUI-Flagship-Website-M1.zip . -x 'node_modules/*' '.next/*'

      - name: Upload evidence and ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nui-flagship-m1
          path: |
            nui-flagship-site/test-results
            nui-flagship-site/playwright-report
            /tmp/NUI-Flagship-Website-M1.zip
          if-no-files-found: warn
          retention-days: 30
