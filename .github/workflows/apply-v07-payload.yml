name: Apply RepoTrial 0.7 checkpoint
on:
  push:
    branches:
      - feat/causal-adversarial-reasoning-v0.7
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage RepoTrial 0.7 verified checkpoint payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/causal-adversarial-reasoning-v0.7
          fetch-depth: 0
      - name: Apply verified checkpoint
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .repotrial-v07-payload.tgz
          rm -f .repotrial-v07-payload.tgz .github/workflows/apply-v07-payload.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: RepoTrial 0.7 causal adversarial reasoning engine'
          git push origin HEAD:feat/causal-adversarial-reasoning-v0.7
